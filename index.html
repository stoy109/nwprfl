<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>stoy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112,100..800&family=Familjen+Grotesk:wght@400..700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,100;1,9..144,300..700,100&family=Noto+Sans+JP:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-who="stoy">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="rotate" hidden>
      <div class="phone" aria-hidden="true"></div>
      <p>Rotate your phone</p>
    </div>
    <div id="app">
      <header>
        <div class="switch" role="group" aria-label="Persona">
          <button type="button" id="who-stoy" aria-pressed="true">stoy</button>
          <span class="pipe" aria-hidden="true">|</span>
          <button type="button" id="who-dyp" aria-pressed="false">dyp</button>
        </div>
        <p class="route" id="route" aria-hidden="true">/</p>
        <p class="showing" id="showing" hidden>
          <span id="showing-label">Showing</span>
          <span class="page-title" id="page-title"></span>
        </p>
      </header>
      <main id="stage"></main>
      <button type="button" id="back" hidden>← Back</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
